# ============================================================================
# dsh-minecraft-pet —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件会把 Minecraft 方块小人挂件插入 Web profile 的配置树。
#
# 安装方式（不再需要手工复制/手工改 profile patch）：
#   dsh plugin --profile web add dsh-minecraft-pet
# 或本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-minecraft-pet
      name: dsh-minecraft-pet
