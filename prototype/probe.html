<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>m0 probe</title>
  </head>
  <body>
    <pre id="out">pending</pre>
    <script type="module">
      // 无头浏览器探针：渲染指定皮肤并把结果指纹写进 DOM，
      // 供 `msedge --headless --dump-dom` 抓取，与 node 路径比对。
      import {
        createFrame,
        clearFrame,
        skinFromImage,
        drawParts,
        toImageData,
      } from '../assets/skin-render.js'
      import { staticParts } from '../assets/skin-model.js'

      const W = 352
      const H = 416
      const q = new URLSearchParams(location.search)
      const skinUrl = q.get('skin') || '../assets/default-skin.png'
      const slim = q.get('slim') === '1'
      const out = document.getElementById('out')

      // FNV-1a 32bit，遍历 RGBA 全部字节
      function fnv1a(bytes) {
        let h = 0x811c9dc5
        for (let i = 0; i < bytes.length; i++) {
          h ^= bytes[i]
          h = Math.imul(h, 0x01000193) >>> 0
        }
        return h.toString(16).padStart(8, '0')
      }

      const img = new Image()
      const q2 = new URLSearchParams(location.search)
      const bench = q2.get('bench') === '1'
      const benchFrames = Number(q2.get('frames') || 120)
      img.onload = () => {
        try {
          const c = document.createElement('canvas')
          c.width = img.width
          c.height = img.height
          const cx = c.getContext('2d', { willReadFrequently: true })
          cx.drawImage(img, 0, 0)
          const { data } = cx.getImageData(0, 0, c.width, c.height)
          const skin = skinFromImage({ width: c.width, height: c.height, data })

          // bench 模式：量「每帧 buildParts + drawParts」的真实浏览器耗时，
          // 用来判断能不能把 idle 基线提到 60fps（plan.md §11.2 预算 < 6 ms）。
          if (bench) {
            const frame = createFrame(W, H)
            const times = []
            for (let i = 0; i < benchFrames; i++) {
              const t0 = performance.now()
              clearFrame(frame)
              drawParts(frame, staticParts(skin, { outer: true, armWidth: slim ? 3 : 4 }), skin)
              times.push(performance.now() - t0)
            }
            const sorted = [...times].sort((a, b) => a - b)
            const pct = (p) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))]
            out.textContent = JSON.stringify({
              ok: true,
              mode: 'bench',
              frames: benchFrames,
              median: +pct(0.5).toFixed(2),
              p95: +pct(0.95).toFixed(2),
              max: +sorted[sorted.length - 1].toFixed(2),
            })
            return
          }

          const frame = createFrame(W, H)
          clearFrame(frame)
          drawParts(frame, staticParts(skin, { outer: true, armWidth: slim ? 3 : 4 }), skin)
          const rgba = toImageData(frame)
          let opaque = 0
          for (let i = 3; i < rgba.length; i += 4) if (rgba[i] > 0) opaque++
          out.textContent = JSON.stringify({
            ok: true,
            skin: `${skin.width}x${skin.height}`,
            legacy: skin.legacy,
            armWidth: slim ? 3 : 4,
            opaque,
            bounds: frame.bounds,
            hash: fnv1a(rgba),
          })
        } catch (e) {
          out.textContent = JSON.stringify({ ok: false, error: String(e) })
        }
      }
      img.onerror = () => {
        out.textContent = JSON.stringify({ ok: false, error: 'skin load failed' })
      }
      img.src = skinUrl
    </script>
  </body>
</html>
